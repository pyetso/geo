<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#faf8f5" />
  <title>GeoHub</title>
  <meta name="description" content="Geography games using live radio and flight data." />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="shell">
    <section class="game-view active" id="radio-view" data-game="radio" aria-label="Radio country guessing game">
      <div class="wave-wrap" id="wave-wrap">
        <canvas id="waveform" aria-label="Live audio waveform"></canvas>
        <div id="audio-state" class="audio-state">Finding a station…</div>
      </div>

      <audio id="radio-player" preload="auto" crossorigin="anonymous"></audio>

      <div class="player-row" aria-label="Radio controls">
        <button class="circle-control primary" id="play-pause" type="button" aria-label="Play radio" title="Play or pause">
          <svg class="icon-pause" viewBox="0 0 24 24"><path d="M8 6v12M16 6v12"/></svg>
          <svg class="icon-play" viewBox="0 0 24 24"><path d="m9 7 8 5-8 5Z"/></svg>
        </button>
        <button class="circle-control" id="restart" type="button" aria-label="Restart stream" title="Restart stream">
          <svg viewBox="0 0 24 24"><path d="M4 8V4m0 0h4M4 4l4 4a7 7 0 1 1-1.4 8.2"/></svg>
        </button>
        <div class="volume-control">
          <button class="circle-control" id="volume-toggle" type="button" aria-label="Volume" title="Volume">
            <svg viewBox="0 0 24 24"><path d="M5 10v4h3l4 4V6l-4 4H5Zm10-1a4 4 0 0 1 0 6m2.5-8.5a7.5 7.5 0 0 1 0 11"/></svg>
          </button>
          <div class="volume-popover">
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.72" aria-label="Radio volume" />
          </div>
        </div>
      </div>

      <div class="interaction-block" id="radio-interaction">
        <form class="guess-form" id="guess-form" autocomplete="off">
          <div class="country-combobox">
            <label class="sr-only" for="country-input">Country</label>
            <input id="country-input" type="text" placeholder="Which country is this?" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="country-suggestions" spellcheck="false" />
            <div class="suggestions" id="country-suggestions" role="listbox"></div>
          </div>
          <button class="guess-button" type="submit">Guess</button>
        </form>

        <div class="station-actions" id="station-actions" hidden>
          <button class="next-button" id="next-after-answer" type="button">Next</button>
        </div>

        <div class="guess-board" id="previous-guesses" hidden aria-live="polite">
          <div class="guess-board-rows" id="previous-guesses-list"></div>
          <div class="guess-slots" id="guess-slots" aria-hidden="true"></div>
        </div>

        <div class="feedback" id="feedback" aria-live="polite"></div>
      </div>
    </section>

    <section class="game-view" id="flight-view" data-game="flight" aria-label="Flight country guessing game" hidden>
      <div class="flight-card">
        <div class="flight-illustration" aria-label="Geographic flight route illustration">
          <svg id="flight-route-svg" viewBox="0 0 680 220" role="img" aria-label="Actual route geometry between departure and arrival">
            <path class="flight-gridline" d="M28 110H652"/>
            <path class="flight-path" id="flight-route-path" d="M60 150 Q340 40 620 150"/>
            <circle class="route-endpoint" id="flight-departure-dot" cx="60" cy="150" r="5"/>
            <circle class="route-endpoint" id="flight-arrival-dot" cx="620" cy="150" r="5"/>
            <text class="route-code" id="flight-from" x="60" y="178" text-anchor="middle">---</text>
            <text class="route-code" id="flight-to" x="620" y="178" text-anchor="middle">---</text>
            <g class="plane-marker" id="plane-marker" transform="translate(340 80)">
              <circle r="21"/>
              <path d="M11 4V1L2-5v-7a2 2 0 0 0-4 0v7l-9 6v3l9-3v6l-3 2v2l5-1.5L5 11V9L2 7V1l9 3Z"/>
            </g>
          </svg>
        </div>

        <div class="flight-info-grid">
          <div><span class="flight-label">Flight</span><strong id="flight-number">—</strong></div>
          <div><span class="flight-label">Airline</span><strong id="flight-airline">—</strong></div>
          <div><span class="flight-label">Altitude</span><strong id="flight-altitude">—</strong></div>
          <div><span class="flight-label">Speed</span><strong id="flight-speed">—</strong></div>
        </div>
      </div>

      <div class="interaction-block flight-interaction" id="flight-interaction">
        <div class="flight-question" id="flight-question">Finding an active flight…</div>
        <form class="guess-form" id="flight-guess-form" autocomplete="off">
          <div class="country-combobox">
            <label class="sr-only" for="flight-country-input">Country</label>
            <input id="flight-country-input" type="text" placeholder="Type a country" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="flight-country-suggestions" spellcheck="false" />
            <div class="suggestions" id="flight-country-suggestions" role="listbox"></div>
          </div>
          <button class="guess-button" type="submit">Guess</button>
        </form>
        <div class="station-actions" id="flight-actions" hidden>
          <button class="next-button" id="next-flight" type="button">Next</button>
        </div>
        <div class="guess-board" id="flight-previous-guesses" hidden aria-live="polite">
          <div class="guess-board-rows" id="flight-previous-guesses-list"></div>
          <div class="guess-slots" id="flight-guess-slots" aria-hidden="true"></div>
        </div>
        <div class="feedback" id="flight-feedback" aria-live="polite"></div>
      </div>
    </section>
    <section class="game-view" id="news-view" data-game="news" aria-label="Newspaper country guessing game" hidden>
      <div class="newspaper-stage">
        <article class="newspaper-card" aria-live="polite">
          <div class="newspaper-rule"></div>
          <div class="newspaper-masthead">THE DAILY</div>
          <div class="newspaper-meta"><span id="news-source">World desk</span><span id="news-date">Today</span></div>
          <div class="newspaper-rule"></div>
          <h1 id="news-title">Finding a story…</h1>
          <p id="news-description"></p>
          <div class="newspaper-columns" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        </article>
      </div>
      <div class="interaction-block news-interaction" id="news-interaction">
        <div class="flight-question" id="news-question">Finding a current headline…</div>
        <form class="guess-form" id="news-guess-form" autocomplete="off">
          <div class="country-combobox">
            <label class="sr-only" for="news-country-input">Country</label>
            <input id="news-country-input" type="text" placeholder="Which country is this about?" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="news-country-suggestions" spellcheck="false" />
            <div class="suggestions" id="news-country-suggestions" role="listbox"></div>
          </div>
          <button class="guess-button" type="submit">Guess</button>
        </form>
        <div class="station-actions" id="news-actions" hidden><button class="next-button" id="next-news" type="button">Next</button></div>
        <div class="guess-board" id="news-previous-guesses" hidden aria-live="polite">
          <div class="guess-board-rows" id="news-previous-guesses-list"></div>
          <div class="guess-slots" id="news-guess-slots" aria-hidden="true"></div>
        </div>
        <div class="feedback" id="news-feedback" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <nav class="game-nav" aria-label="Switch game">
    <button class="game-nav-button active" type="button" data-target="radio" aria-label="Radio game" title="Radio">
      <svg viewBox="0 0 24 24"><path d="M4 12h2m2-4v8m4-11v14m4-11v8m4-4h2"/></svg>
    </button>
    <button class="game-nav-button" type="button" data-target="flight" aria-label="Flight game" title="Flights">
      <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V18l-2 1.5V21l3.5-1 3.5 1v-1.5L13 18v-4.5L21 16Z"/></svg>
    </button>
    <button class="game-nav-button" type="button" data-target="news" aria-label="Newspaper game" title="Newspaper">
      <svg viewBox="0 0 24 24"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2V4Z"/><path d="M8 8h8M8 11h8M8 14h4M15 14h1M8 17h8"/></svg>
    </button>
  </nav>

  <script src="./client.js" defer></script>
</body>
</html>
