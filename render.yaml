services:
  - type: web
    name: geohub
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEWS_API_KEY
        sync: false
      - key: AVIATIONSTACK_API_KEY
        sync: false
